<title>Flip Clock</title>
<!--

  케이스의 마스킹 베젤 창 위치는 아래 layout JSON 하나가 기준이다.
  ../build_flip_clock.py 가 이 블록을 읽어 베젤 창을 뚫으므로, 창을 옮길 때는 여기만 고친다.
  좌표: 화면 표시 영역 왼쪽 위 = (0,0), 단위 mm, 가로 방향(홈 버튼이 오른쪽 또는 아래인 것과 무관하게 화면 기준).
  구형 크롬/삼성 인터넷에서도 돌도록 ES5 로만 쓴다.
-->
<script id="layout" type="application/json">
{
  "screen_mm": [217.5, 135.9],
  "screen_px": [1280, 800],
  "card_inset": 1.6,
  "window_r": 2.5,
  "windows": [
    {"id": "wtop",  "shape": "rect", "x": 6.0,  "y": 6.0,  "w": 69.0, "h": 40.0},
    {"id": "wtemp", "shape": "rect", "x": 12.0, "y": 50.0, "w": 57.0, "h": 32.0},
    {"id": "winfo", "shape": "rect", "x": 6.0,  "y": 86.0, "w": 69.0, "h": 44.0},
    {"id": "year",  "shape": "rect", "x": 111.25, "y": 6.0, "w": 70.0, "h": 20.0},
    {"id": "month", "shape": "rect", "x": 81.0,  "y": 31.0, "w": 63.0, "h": 44.0},
    {"id": "day",   "shape": "rect", "x": 148.5, "y": 31.0, "w": 63.0, "h": 44.0},
    {"id": "clock", "shape": "circle", "cx": 112.5, "cy": 104.0, "r": 26.0},
    {"id": "wday",  "shape": "rect", "x": 148.5, "y": 82.0, "w": 63.0, "h": 44.0}
  ]
}
</script>
<style>

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;   /* 모바일 글자 자동 확대 끔 */
    font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;   /* 실물 카드는 보통 폭 굵은 헬베티카 */
  }
  #stage { position: absolute; left: 0; top: 0; -webkit-transform-origin: 0 0; transform-origin: 0 0; }

  /* ---- 플립 카드 ---- */
  .flap {
    position: absolute;
    -webkit-perspective: 600px; perspective: 600px;
  }
  .half, .leaf {
    position: absolute; left: 0; width: 100%; height: 50%;
    overflow: hidden;
    background: #1b1b1b;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .top    { top: 0;   border-radius: var(--r) var(--r) 0 0; }
  .bottom { top: 50%; border-radius: 0 0 var(--r) var(--r); }
  .half.top, .leaf.top {
    background: -webkit-linear-gradient(top, #2a2a2a, #1c1c1c);
    background: linear-gradient(to bottom, #2a2a2a, #1c1c1c);
  }
  .half.bottom, .leaf.bottom {
    background: -webkit-linear-gradient(top, #161616, #101010);
    background: linear-gradient(to bottom, #161616, #101010);
  }
  /* 요일 카드: 토·일 빨강, 평일 초록 (참고한 빈티지 플립 시계 실물). 반쪽마다 색을 따로 칠해 넘어가는 중에도 옛/새 색이 맞음 */
  .c-red.top {
    background: -webkit-linear-gradient(top, #e0322b, #c92620);
    background: linear-gradient(to bottom, #e0322b, #c92620);
  }
  .c-red.bottom {
    background: -webkit-linear-gradient(top, #bd231d, #a91d18);
    background: linear-gradient(to bottom, #bd231d, #a91d18);
  }
  .c-green.top {
    background: -webkit-linear-gradient(top, #2c9a48, #23883d);
    background: linear-gradient(to bottom, #2c9a48, #23883d);
  }
  .c-green.bottom {
    background: -webkit-linear-gradient(top, #1f7f38, #1a6e30);
    background: linear-gradient(to bottom, #1f7f38, #1a6e30);
  }
  .face {
    position: absolute; left: 0; width: 100%;
    color: #f4f2ec; font-weight: bold; text-align: center;
    white-space: nowrap;
  }
  .top .face { top: 0; }
  .bottom .face { bottom: 0; }
  .face .sub { font-size: 38%; vertical-align: baseline; margin-left: 0.15em; letter-spacing: 0; }
  .leaf.top    { -webkit-transform-origin: 50% 100%; transform-origin: 50% 100%; z-index: 3; }
  .leaf.bottom { -webkit-transform-origin: 50% 0;    transform-origin: 50% 0;    z-index: 3;
                 -webkit-transform: rotateX(90deg); transform: rotateX(90deg); }
  /* 넘어가는 동안 잎에 드리우는 그림자 */
  .shade { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; opacity: 0; pointer-events: none; }
  /* 가운데 경첩 틈과 양옆 경첩 핀 */
  .hinge { position: absolute; left: 0; width: 100%; top: 50%; height: 2px; margin-top: -1px; background: #000; z-index: 5; }
  .pin { position: absolute; top: 50%; width: 3.5%; height: 9%; margin-top: -4.5%; background: #050505; z-index: 6; border-radius: 1px; }
  .pin.l { left: -1.5%; } .pin.r { right: -1.5%; }
  /* 아래에 깔린 카드 두께(겹친 모서리) */
  .stack { position: absolute; left: 2%; width: 96%; height: 1px; background: #2c2c2c; z-index: 0; }
  .stack.c-red { background: #8a1714; }
  .stack.c-green { background: #22903f; }
  /* 베젤이 창 위쪽에 드리우는 그림자 (입체감) */
  .vshadow {
    position: absolute; left: 0; top: 0; width: 100%; height: 22%; z-index: 7; pointer-events: none;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0.55), rgba(0,0,0,0));
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0));
  }

  /* 연도: 경첩 없는 한 장짜리 띠(드럼)가 통째로 굴러감 (참고 실물 사진) */
  .drum { position: absolute; overflow: hidden; background: #1c1c1b; -webkit-perspective: 300px; perspective: 300px; }
  .dface {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    color: #d8d7d1; font-weight: 500; letter-spacing: 0.04em; text-align: center; white-space: nowrap;   /* 실물은 카드보다 덜 굵음 */
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .dshade {   /* 원통이라 위아래 가장자리가 조금 어두움 */
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0.3), rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,0.3));
    background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0) 14%, rgba(0,0,0,0) 86%, rgba(0,0,0,0.3));
  }

  #clock { position: absolute; }

  /* ---- 날씨 창 (왼쪽): 플립 없이 화면에 바로 그림. 베젤 창 안쪽이 실물 문자판처럼 보이도록 무광 검정 판 ---- */
  #wx {
    position: absolute; overflow: hidden; color: #eeebe2; text-align: center;
    background: -webkit-linear-gradient(top, #1d1d1c, #121211);
    background: linear-gradient(to bottom, #1d1d1c, #121211);
  }
  /* 날씨 판 안쪽은 10배 크기(1px = 0.1 mm)로 쓰고 .wxin 을 1/10 로 줄임: 구형 안드로이드 브라우저가 4px 같은 작은 글자를
     최소 글자 크기로 키워 줄이 겹쳤음 (2026-10-21 탭 실물). 최소 크기는 확대·축소 전 지정 크기로 판단됨 */
  #wx .wxin { position: absolute; left: 0; top: 0; zoom: 0.1; }
  #wx .wxin.tf { zoom: 1; -webkit-transform: scale(0.1); transform: scale(0.1); -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  #wx .wxin .loc { position: absolute; left: 0; width: 100%; top: 65px; font-size: 46px; font-weight: bold; color: #d8d5cc; white-space: nowrap; }
  #wx .wxin svg { vertical-align: -0.12em; margin-right: 0.25em; }
  /* 위 창 전체가 아이폰 날씨처럼 움직이는 하늘 (wxSky). 지역 이름은 그 위에 그림자를 두고 */
  #wx .wxin canvas { position: absolute; left: 0; top: 0; width: 690px; height: 400px; }
  /* 시간별 예보 줄 (하늘 창 아래 14 mm): 지금 + 3시간 간격 4칸. 칸 폭 13.8 mm 라 그림은 SVG, 글자는 굵게+그림자 */
  #wx .wxin .hrs { position: absolute; left: 0; top: 262px; width: 690px; height: 138px; display: -webkit-flex; display: flex;
                   background: rgba(0,0,0,0.34); border-top: 2px solid rgba(255,255,255,0.12); }
  #wx .wxin .hr { -webkit-flex: 1; flex: 1; text-align: center; color: #f2efe8; text-shadow: 0 1px 3px rgba(0,0,0,0.8); white-space: nowrap; }
  #wx .wxin .hr .tm { font-size: 25px; line-height: 30px; margin-top: 5px; color: #d3d0c8; }
  #wx .wxin .hr.now .tm { color: #fff; font-weight: bold; }
  #wx .wxin .hr svg { display: block; width: 58px; height: 58px; margin: 0 auto; vertical-align: 0; }
  #wx .wxin .hr .tp { font-size: 34px; line-height: 42px; font-weight: bold; }
  #wx .wxin .hr .pp { font-size: 24px; color: #8cc8ff; margin-left: 5px; }
  #wx .wxin .loc { text-shadow: 0 0 14px rgba(0,0,0,0.75), 0 2px 4px rgba(0,0,0,0.6); }
  #wx .wxin .desc { position: absolute; left: 0; width: 100%; top: 822px; font-size: 84px; color: #d8d5cc; white-space: nowrap; }
  #wx .wxin .rule { position: absolute; left: 9%; width: 82%; top: 935px; height: 3.5px; background: #4a4945; }
  /* 아래 칸: 작은 글자 줄 대신 왼쪽 습도 숫자, 오른쪽 미세먼지 얼굴 아이콘 두 칸 (2026-10-26) */
  #wx .wxin .big { position: absolute; top: 960px; width: 50%; height: 260px; line-height: 260px; white-space: nowrap; }
  #wx .wxin .hum { left: 0; font-size: 112px; font-weight: bold; color: #eeebe2; }
  #wx .wxin .hum svg { width: 0.42em; height: 0.56em; vertical-align: 0; margin-right: 0.12em; }
  #wx .wxin .dust { left: 50%; font-size: 200px; color: #6d6b65; }
  #wx .wxin .dust svg { vertical-align: middle; margin: 0; }
  #wx .wxin .vrule { position: absolute; left: 50%; top: 985px; width: 3.5px; height: 210px; margin-left: -1.75px; background: #4a4945; }
  #wx .wxin .stat { position: absolute; left: 0; width: 100%; top: 20px; font-size: 26px; color: #6d6b65; white-space: nowrap; }
  #wx.stale .wxin .desc, .flap.wstale { opacity: 0.55; }

  /* ---- 시작·설정 ---- */
  #tap {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 50;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    color: #888; font-size: 22px; background: rgba(0,0,0,0.6);
  }
  #dim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40;
         -webkit-transition: opacity 3s; transition: opacity 3s; }
  /* 잔상 방지: 쉬는 시간 검은 화면, 매시 30분 화면 닦기 */
  #rest { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; z-index: 50;
          -webkit-transition: opacity 3s; transition: opacity 3s; }
  #wipe { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; display: none; pointer-events: none; z-index: 55;
          -webkit-transition: background-color 1s; transition: background-color 1s; }
  .outline { position: absolute; border: 2px solid #19e6ff; box-sizing: border-box; z-index: 30; pointer-events: none; }
  #panel {
    position: absolute; left: 50%; top: 50%; width: 560px; margin-left: -280px; margin-top: -262px; z-index: 60;
    background: #f3f1ea; color: #222; border-radius: 10px; padding: 18px 22px; font-family: sans-serif; font-size: 18px;
    display: none; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  #panel h3 { margin: 0 0 10px; font-size: 20px; }
  #panel .row { margin: 9px 0; }
  #panel button { font-size: 18px; padding: 8px 14px; margin: 2px; border-radius: 6px; border: 1px solid #999; background: #fff; color: #222; }
  #panel .val { display: inline-block; min-width: 90px; text-align: center; font-family: monospace; }
  #panel input[type=range] { width: 260px; vertical-align: middle; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="dim"></div>
<div id="rest"></div>
<div id="wipe"></div>

<div id="tap">화면을 눌러 시작 (소리·전체화면)</div>
<div id="panel">
  <h3>베젤 맞춤 · 설정</h3>
  <div class="row">가로 위치
    <button data-k="dx" data-d="-0.5">◀◀</button><button data-k="dx" data-d="-0.1">◀</button>
    <span class="val" id="v_dx"></span>
    <button data-k="dx" data-d="0.1">▶</button><button data-k="dx" data-d="0.5">▶▶</button></div>
  <div class="row">세로 위치
    <button data-k="dy" data-d="-0.5">▲▲</button><button data-k="dy" data-d="-0.1">▲</button>
    <span class="val" id="v_dy"></span>
    <button data-k="dy" data-d="0.1">▼</button><button data-k="dy" data-d="0.5">▼▼</button></div>
  <div class="row">크기 비율
    <button data-k="sc" data-d="-0.002">－</button>

  <div class="row">날씨 지역
    <button id="b_city_prev">◀</button><span class="val" id="v_city" style="min-width:150px"></span><button id="b_city_next">▶</button></div>
  <div class="row">플립 소리 <input type="range" id="vol" min="0" max="1" step="0.05"></div>

    <button id="b_close">닫기</button>
  </div>
  <div class="row">
    <button id="b_rest">쉬는 시간 검은 화면: 켬</button>
    <button id="b_wipe">매시 30분 화면 닦기: 켬</button>
    <button id="b_drift">화면 조금씩 옮기기: 켬</button>
  </div>

<script>
(function () {
  "use strict";
  var L = JSON.parse(document.getElementById("layout").textContent);
  var W = {};
  for (var i = 0; i < L.windows.length; i++) W[L.windows[i].id] = L.windows[i];

  var MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var DAYS = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

  // ---------- 저장된 설정 (브라우저 저장소가 막혀도 동작) ----------
  var cfg = { dx: 0, dy: 0, sc: 1, vol: 0.8, night: true, city: 0, rest: true, wipe: true, drift: true };
  try { var s = JSON.parse(localStorage.getItem("flipclock.cfg")); if (s) for (var k in s) cfg[k] = s[k]; } catch (e) {}
  function save() { try { localStorage.setItem("flipclock.cfg", JSON.stringify(cfg)); } catch (e) {} }

  // ---------- 화면 배치: mm → px ----------
  var stage = document.getElementById("stage");
  var MM = 1;   // 1 mm 당 CSS px (resize 에서 갱신)
  var ZOOM = "zoom" in document.documentElement.style;
  // 잔상 방지 이동: 3분마다 화면 전체를 ±0.35 mm(약 2 px) 안에서 9자리로 옮겨 경계선이 한 곳에 고정되지 않게 함
  var DRIFT = [[0, 0], [0.35, 0], [0.35, 0.35], [0, 0.35], [-0.35, 0.35], [-0.35, 0], [-0.35, -0.35], [0, -0.35], [0.35, -0.35]];
  var drift = [0, 0];
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    MM = Math.min(w / L.screen_mm[0], h / L.screen_mm[1]) * cfg.sc;
    stage.style.width = L.screen_mm[0] + "px";
    stage.style.height = L.screen_mm[1] + "px";
    var tx = (w - L.screen_mm[0] * MM) / 2 + (cfg.dx + drift[0]) * MM, ty = (h - L.screen_mm[1] * MM) / 2 + (cfg.dy + drift[1]) * MM;
    // stage 안은 1px = 1mm 로 그리고 통째로 확대한다.
    // zoom 을 쓴다: transform scale 은 구형 안드로이드 브라우저가 작은 그림을 늘려 글자가 흐리고,
    // 4px 같은 작은 글자를 최소 글자 크기로 키워 줄이 겹쳤다 (2026-10-21 탭 실물). zoom 은 확대된 크기로 다시 그림
    if (ZOOM) {
      stage.style.zoom = MM;
      stage.style.left = (tx / MM) + "px"; stage.style.top = (ty / MM) + "px";   // zoom 된 요소의 left/top 도 MM 배
    } else {
      var t = "translate(" + tx + "px," + ty + "px) scale(" + MM + ")";
      stage.style.webkitTransform = t; stage.style.transform = t;
    }
  }

  // ---------- 플립 소리 (Web Audio 합성, 파일 없음) ----------
  var AC = null, noiseBuf = null;
  function audioInit() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    var n = Math.floor(AC.sampleRate * 0.25);
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  function burst(t, freq, q, decay, gain) {
    var src = AC.createBufferSource(); src.buffer = noiseBuf;
    var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq; bp.Q.value = q;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    src.connect(bp); bp.connect(g); g.connect(AC.destination);
    src.start ? src.start(t, Math.random() * 0.15) : src.noteOn(t);
    src.stop ? src.stop(t + decay + 0.02) : src.noteOff(t + decay + 0.02);
  }
  function thump(t, gain) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(AC.destination);
    o.start ? o.start(t) : o.noteOn(t); o.stop ? o.stop(t + 0.09) : o.noteOff(t + 0.09);
  }
  // 잎이 걸쇠에서 풀리는 '틱' + 아래 카드에 부딪히는 '착'. size: 카드 크기에 따라 음색을 바꿈 (큰 카드 = 낮고 큼)
  function flipSound(delay, dur, size) {
    if (!AC || !noiseBuf || cfg.vol <= 0 || AC.state === "suspended") return;
    var v = cfg.vol, j = 0.9 + Math.random() * 0.2;
    var t0 = AC.currentTime + delay / 1000, t1 = t0 + dur / 1000 * 0.92;
    var lo = size > 40 ? 0.8 : 1.15;
    burst(t0, 4200 * lo * j, 2.0, 0.018, 0.12 * v);
    burst(t1, 2100 * lo * j, 0.9, 0.045, 0.55 * v);
    burst(t1 + 0.004, 900 * lo, 1.2, 0.03, 0.25 * v);
    thump(t1, 0.35 * v * (size > 40 ? 1 : 0.6));
  }

  // ---------- 플립 카드 ----------
  function el(tag, cls, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }
  function Flap(win, opts) {
    var ins = L.card_inset;
    this.w = win.w - 2 * ins; this.h = win.h - 2 * ins;
    this.font = opts.font; this.sub = opts.sub || null;
    this.squeeze = opts.squeeze || 1;
    this.color = opts.color || null; this.stackColor = opts.stackColor || null;
    var root = this.root = el("div", "flap", stage);
    root.style.left = (win.x + ins) + "px"; root.style.top = (win.y + ins) + "px";
    root.style.width = this.w + "px"; root.style.height = this.h + "px";
    root.style.setProperty && root.style.setProperty("--r", (this.h * 0.06) + "px");
    this.stacks = [];
    for (var s = 3; s >= 1; s--) { var st = el("div", "stack", root); st.style.top = (this.h + s * 0.35) + "px"; st.style.height = "0.25px"; this.stacks.push(st); }
    this.sTop = this.part("half top"); this.sBot = this.part("half bottom");
    this.lTop = this.part("leaf top"); this.lBot = this.part("leaf bottom");
    el("div", "hinge", root).style.height = "0.5px";
    el("div", "pin l", root); el("div", "pin r", root);
    el("div", "vshadow", root);
    this.value = null; this.queue = []; this.busy = false;
  }
  Flap.prototype.part = function (cls) {
    var p = el("div", cls, this.root);
    p.base = cls;
    var f = el("div", "face", p);
    f.style.height = this.h + "px"; f.style.lineHeight = (this.h * 1.04) + "px"; f.style.fontSize = this.font + "px";
    if (this.squeeze < 1) {   // 좁은 굵은 글꼴처럼 가로만 줄임. 넓게 깐 뒤 가운데 기준으로 줄여 가운데 정렬 유지
      f.style.left = "-50%"; f.style.width = "200%";
      f.style.webkitTransform = f.style.transform = "scaleX(" + this.squeeze + ")";
    }
    p.face = f; p.shade = el("div", "shade", p);
    return p;
  };
  Flap.prototype.html = function (v) {
    var t = v[0];
    return v[1] ? t + '<span class="sub">' + v[1] + "</span>" : t;
  };
  // 반쪽 하나에 값과 그 값의 카드 색을 같이 넣음
  Flap.prototype.show = function (p, v) {
    p.face.innerHTML = this.html(v);
    if (this.color) p.className = p.base + " c-" + this.color(v);
  };
  // 아래 깔린 카드 모서리 = 다음에 올 카드 색 (일요일 빨강 밑으로 월요일 초록이 보임)
  Flap.prototype.paintStack = function (v) {
    if (!this.stackColor) return;
    for (var i = 0; i < this.stacks.length; i++) this.stacks[i].className = "stack c-" + this.stackColor(v);
  };
  Flap.prototype.set = function (v) {
    this.show(this.sTop, v); this.show(this.sBot, v); this.show(this.lTop, v); this.show(this.lBot, v);
    this.paintStack(v);
    this.value = v.join("|");
  };
  // 값 하나로 넘기기. steps: 그 앞에 지나갈 중간 값들 (실제 플립시계처럼 여러 장 넘어감)
  Flap.prototype.flipTo = function (v, steps, dur) {
    if (this.value === null) { this.set(v); return; }
    var list = (steps || []).concat([v]);
    for (var i = 0; i < list.length; i++) this.queue.push({ v: list[i], dur: dur || 320 });
    if (!this.busy) this.next();
  };
  function tr(e, val) { e.style.webkitTransform = val; e.style.transform = val; }
  function trans(e, val) { e.style.webkitTransition = val; e.style.transition = val; }
  Flap.prototype.next = function () {
    var self = this, job = this.queue.shift();
    if (!job) { this.busy = false; return; }
    if (job.v.join("|") === this.value) { this.next(); return; }
    this.busy = true;
    var nv = job.v, d = job.dur, half = d / 2;
    // 준비: 뒤 정지 윗반 = 새 값, 넘어갈 윗잎 = 옛 값, 내려올 아랫잎 = 새 값
    this.show(this.sTop, nv);
    this.show(this.lBot, nv);
    trans(this.lTop, "none"); trans(this.lBot, "none");
    trans(this.lTop.shade, "none"); trans(this.lBot.shade, "none"); trans(this.sBot.shade, "none");
    tr(this.lTop, "rotateX(0deg)"); tr(this.lBot, "rotateX(90deg)");
    this.lTop.shade.style.opacity = 0; this.lBot.shade.style.opacity = 0.6; this.sBot.shade.style.opacity = 0;
    this.lTop.style.visibility = "visible";
    void this.root.offsetWidth;   // 강제 리플로 → 다음 transition 이 적용됨
    flipSound(0, d, this.h);
    trans(this.lTop, "-webkit-transform " + half + "ms cubic-bezier(.55,0,.9,.6)");
    trans(this.lTop, "transform " + half + "ms cubic-bezier(.55,0,.9,.6)");
    trans(this.lTop.shade, "opacity " + half + "ms ease-in");
    trans(this.sBot.shade, "opacity " + half + "ms ease-in");
    tr(this.lTop, "rotateX(-90deg)");
    this.lTop.shade.style.opacity = 0.5; this.sBot.shade.style.opacity = 0.35;
    setTimeout(function () {
      self.lTop.style.visibility = "hidden";
      trans(self.lBot, "-webkit-transform " + half + "ms cubic-bezier(.2,.6,.35,1.25)");
      trans(self.lBot, "transform " + half + "ms cubic-bezier(.2,.6,.35,1.25)");
      trans(self.lBot.shade, "opacity " + half + "ms ease-out");
      tr(self.lBot, "rotateX(0deg)");
      self.lBot.shade.style.opacity = 0;
      setTimeout(function () {
        self.show(self.sBot, nv); self.show(self.lTop, nv); self.paintStack(nv);
        trans(self.sBot.shade, "none"); self.sBot.shade.style.opacity = 0;
        self.lTop.style.visibility = "visible";
        self.value = job.v.join("|");
        setTimeout(function () { self.next(); }, 40);
      }, half);
    }, half);
  };

  // ---------- 연도 드럼 (Flap 과 같은 flipTo 인터페이스) ----------
  // 옛 값 면은 원통 축을 중심으로 위로 굴러 사라지고, 새 값 면이 아래에서 굴러 올라옴
  function Drum(win, opts) {
    var ins = L.card_inset;
    this.w = win.w - 2 * ins; this.h = win.h - 2 * ins; this.font = opts.font;
    var root = this.root = el("div", "drum", stage);
    root.style.left = (win.x + ins) + "px"; root.style.top = (win.y + ins) + "px";
    root.style.width = this.w + "px"; root.style.height = this.h + "px";
    root.style.borderRadius = (this.h * 0.08) + "px";
    this.faces = [this.face(), this.face()];
    el("div", "dshade", root);
    el("div", "vshadow", root);
    this.value = null; this.queue = []; this.busy = false;
  }
  Drum.prototype.face = function () {

    else { keepAwake(); update(now); nightDim(now); }
  }
  // 매시 30분에 9초 동안 흰색·검은색으로 화면 전체를 바꿔 고정 무늬를 풀어 줌 (밤에는 회색)
  function wipe(now) {
    var hi = cfg.night && (now.getHours() >= 23 || now.getHours() < 6) ? "#777" : "#fff";
    var seq = [hi, "#000", hi, "#000"];
    wipeEl.style.backgroundColor = "#000"; wipeEl.style.display = "block";
    seq.forEach(function (c, i) { setTimeout(function () { wipeEl.style.backgroundColor = c; }, 50 + i * 2200); });
    setTimeout(function () { wipeEl.style.display = "none"; }, 50 + seq.length * 2200);
  }
  function tick() {
    var now = new Date();
    drawClock(now);
    applyRest(now);
    if (now.getSeconds() === 0 && !isResting) {
      update(now); nightDim(now);
      if (cfg.wipe && started && now.getMinutes() === 30) wipe(now);
      if (cfg.drift && now.getMinutes() % 3 === 0) { drift = DRIFT[Math.floor(now.getTime() / 180000) % DRIFT.length]; fit(); }
    }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }

  function relayout() { fit(); clockSize(); drawClock(new Date()); drawWeather(); drawOutlines(); }
  window.addEventListener("resize", relayout);

  // ---------- 시작 (터치 한 번: 소리 잠금 해제 + 전체화면 + 화면 꺼짐 방지) ----------
  var started = false, tapEl = document.getElementById("tap");
  function start() {
    audioInit();
    var de = document.documentElement, rf = de.requestFullscreen || de.webkitRequestFullscreen;
    try { if (rf && !(document.fullscreenElement || document.webkitFullscreenElement)) { var pr = rf.call(de); if (pr && pr.catch) pr.catch(function () {}); } } catch (e) {}
    keepAwake();
    if (started) return;
    started = true; tapEl.style.display = "none";
    var now = new Date();
    setTimeout(function () { update(now, introSteps(now)); }, 300);
  }
  tapEl.addEventListener("click", start);
  var kaVid = document.getElementById("keepawake");
  function keepAwake() {
    // Wake Lock API 와 검은 영상 반복 재생을 같이 건다 (로컬 파일·옛 크롬에서 Wake Lock 이 조용히 안 걸리는 경우 대비)
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (s) { wakeLock = s; }, function () {}); } catch (e) {}
    playKA();
  }
  var wakeLock = null;
  function releaseAwake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
    try { kaVid.pause(); } catch (e) {}
  }
  function playKA() {
    try { kaVid.muted = true; var pr = kaVid.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
  }
  kaVid.addEventListener("pause", function () { if (started && !isResting && !document.hidden) playKA(); });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !isResting) { keepAwake(); update(new Date()); if (!wdata || Date.now() - wdata.t > 15 * 60 * 1000) weatherLoop(); }
  });

  // ---------- 설정 창: 화면 왼쪽 위 모서리를 빠르게 3번 누르면 열림 ----------
  var panel = document.getElementById("panel"), showOutline = false, outlines = [];
  var taps = [];
  document.addEventListener("click", function (e) {
    if (!started || panel.style.display === "block") return;
    if (isResting) { wakeUntil = Date.now() + 5 * 60 * 1000; applyRest(new Date()); return; }
    if (e.clientX > 140 || e.clientY > 140) { audioInit(); return; }
    var t = Date.now(); taps.push(t); taps = taps.filter(function (x) { return t - x < 900; });
    if (taps.length >= 3) { taps = []; openPanel(); }
  });
  function drawOutlines() {
    for (var i = 0; i < outlines.length; i++) stage.removeChild(outlines[i]);
    outlines = [];
    if (!showOutline) return;
    for (var j = 0; j < L.windows.length; j++) {
      var w = L.windows[j], o = el("div", "outline", stage);
      o.style.borderWidth = (1.5 / MM) + "px";
      if (w.shape === "circle") { o.style.left = (w.cx - w.r) + "px"; o.style.top = (w.cy - w.r) + "px"; o.style.width = o.style.height = (2 * w.r) + "px"; o.style.borderRadius = "50%"; }
      else { o.style.left = w.x + "px"; o.style.top = w.y + "px"; o.style.width = w.w + "px"; o.style.height = w.h + "px"; o.style.borderRadius = L.window_r + "px"; }
      outlines.push(o);
    }
    // 화면 표시 영역 전체 윤곽
    var a = el("div", "outline", stage); a.style.borderColor = "#ff3bd0"; a.style.borderWidth = (1.5 / MM) + "px";
    a.style.left = a.style.top = "0px"; a.style.width = L.screen_mm[0] + "px"; a.style.height = L.screen_mm[1] + "px";
    outlines.push(a);
  }
  function showVals() {
    document.getElementById("v_dx").textContent = cfg.dx.toFixed(1) + " mm";
    document.getElementById("v_dy").textContent = cfg.dy.toFixed(1) + " mm";
    document.getElementById("v_sc").textContent = (cfg.sc * 100).toFixed(1) + " %";
    document.getElementById("vol").value = cfg.vol;
    document.getElementById("v_city").textContent = CITIES[cfg.city % CITIES.length][0];
    document.getElementById("b_night").textContent = "야간 흐리게: " + (cfg.night ? "켬" : "끔");
    document.getElementById("b_rest").textContent = "쉬는 시간 검은 화면: " + (cfg.rest ? "켬" : "끔");
    document.getElementById("b_drift").textContent = "화면 조금씩 옮기기: " + (cfg.drift ? "켬" : "끔");
    document.getElementById("b_wipe").textContent = "매시 30분 화면 닦기: " + (cfg.wipe ? "켬" : "끔");
    document.getElementById("b_outline").textContent = showOutline ? "창 윤곽 숨기기" : "창 윤곽 보기";
  }
  function openPanel() { panel.style.display = "block"; showVals(); drift = [0, 0]; fit(); }
  var btns = panel.querySelectorAll("button[data-k]");
  for (var b = 0; b < btns.length; b++) btns[b].addEventListener("click", function () {
    var k = this.getAttribute("data-k"), d = parseFloat(this.getAttribute("data-d"));
    cfg[k] = Math.round((cfg[k] + d) * 1000) / 1000; save(); showVals(); relayout();
  });
  document.getElementById("vol").addEventListener("change", function () { cfg.vol = parseFloat(this.value); save(); flipSound(0, 300, 50); });
  document.getElementById("b_outline").addEventListener("click", function () { showOutline = !showOutline; showVals(); drawOutlines(); });
  document.getElementById("b_night").addEventListener("click", function () { cfg.night = !cfg.night; save(); showVals(); nightDim(new Date()); });
  document.getElementById("b_rest").addEventListener("click", function () { cfg.rest = !cfg.rest; save(); showVals(); applyRest(new Date()); });
  document.getElementById("b_wipe").addEventListener("click", function () { cfg.wipe = !cfg.wipe; save(); showVals(); if (cfg.wipe) { panel.style.display = "none"; wipe(new Date()); } });
  document.getElementById("b_drift").addEventListener("click", function () { cfg.drift = !cfg.drift; save(); showVals(); drift = [0, 0]; fit(); });
  function cityStep(d) { cfg.city = (cfg.city + d + CITIES.length) % CITIES.length; save(); showVals(); drawWeather(); weatherLoop(); }
  document.getElementById("b_city_prev").addEventListener("click", function () { cityStep(-1); });
  document.getElementById("b_city_next").addEventListener("click", function () { cityStep(1); });
  document.getElementById("b_close").addEventListener("click", function () { panel.style.display = "none"; });
  document.getElementById("b_test").addEventListener("click", function () {
    panel.style.display = "none";
    var now = new Date(); update(now, introSteps(now));
  });

  // ---------- 문자판 글꼴 로드 (캔버스는 글꼴이 쓰인 적이 있어야 불러옴) ----------
  var warm = el("div", null, document.body);
  warm.style.cssText = "position:absolute;left:-999px;top:0;visibility:hidden";
  warm.innerHTML = '<span style="font-family:DialQuartz">QUARTZ</span>';
  try {
    if (document.fonts && document.fonts.load)
      document.fonts.load("20px DialQuartz").then(function () { drawClock(new Date()); });
  } catch (e) {}

  // ---------- 초기화 ----------
  relayout();
  update(new Date());
  nightDim(new Date());
  weatherLoop();
  tick();
  if (/[?&]autostart/.test(location.search)) start();
})();
</script>
</body>
</html>
